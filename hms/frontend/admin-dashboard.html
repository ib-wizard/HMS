<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · MediCore HMS</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B1F2E; --ink-2:#122E42; --teal:#0E8074; --teal-light:#14A79A;
    --mint:#F3F8F7; --card:#FFFFFF; --coral:#E76F51; --amber:#F2A93B;
    --slate:#45525B; --slate-light:#8496A0; --border:#E7EEEC; --sidebar-w:250px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif; background:var(--mint); color:var(--slate);}
  a{text-decoration:none; color:inherit;}

  /* Sidebar */
  .sidebar{
    position:fixed; top:0; left:0; width:var(--sidebar-w); height:100vh;
    background:linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
    color:#fff; display:flex; flex-direction:column; padding:26px 18px; z-index:50;
  }
  .brand{display:flex; align-items:center; gap:10px; font-family:'Outfit',sans-serif; font-weight:700; font-size:18px; padding:0 8px 26px;}
  .brand-mark{width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg, var(--teal-light), var(--teal)); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .nav-section{font-size:11px; text-transform:uppercase; letter-spacing:0.8px; color:rgba(255,255,255,0.35); padding:16px 12px 8px;}
  .nav-item{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px;
    font-size:14px; font-weight:500; color:rgba(255,255,255,0.75); cursor:pointer; margin-bottom:2px;
    transition:background .15s, color .15s;
  }
  .nav-item svg{flex-shrink:0; opacity:0.85;}
  .nav-item:hover{background:rgba(255,255,255,0.06); color:#fff;}
  .nav-item.active{background:rgba(20,167,154,0.18); color:#fff; box-shadow:inset 3px 0 0 var(--teal-light);}
  .sidebar-footer{margin-top:auto; padding:14px 12px; border-top:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; gap:10px;}
  .avatar-sm{width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,var(--teal-light),var(--teal)); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; color:#fff;}
  .sidebar-footer .name{font-size:13px; font-weight:600; color:#fff;}
  .sidebar-footer .role{font-size:11.5px; color:rgba(255,255,255,0.5); text-transform:capitalize;}
  .logout-btn{margin-left:auto; cursor:pointer; opacity:0.6;}
  .logout-btn:hover{opacity:1;}

  /* Main */
  .main{margin-left:var(--sidebar-w); padding:28px 36px 60px;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:28px;}
  .topbar h1{font-family:'Outfit',sans-serif; font-size:25px; font-weight:700; color:var(--ink);}
  .topbar .date{font-size:13px; color:var(--slate-light); margin-top:3px;}
  .top-actions{display:flex; gap:10px; align-items:center;}
  .icon-btn{width:38px; height:38px; border-radius:10px; background:#fff; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer;}

  .stat-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:18px; margin-bottom:26px;}
  .stat-card{
    background:var(--card); border-radius:16px; padding:20px 22px; border:1px solid var(--border);
    box-shadow:0 1px 2px rgba(11,31,46,0.03); position:relative; overflow:hidden;
  }
  .stat-card::after{content:''; position:absolute; top:-30px; right:-30px; width:90px; height:90px; border-radius:50%; background:var(--accent, var(--teal)); opacity:0.08;}
  .stat-card .icon{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; margin-bottom:14px; background:var(--accent, var(--teal)); box-shadow:0 6px 14px -4px var(--accent, var(--teal));}
  .stat-card .val{font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:500; color:var(--ink);}
  .stat-card .lbl{font-size:13px; color:var(--slate-light); margin-top:4px;}

  .grid-2{display:grid; grid-template-columns:1.5fr 1fr; gap:18px; margin-bottom:18px;}
  .panel{background:var(--card); border-radius:16px; padding:22px 24px; border:1px solid var(--border); box-shadow:0 1px 2px rgba(11,31,46,0.03);}
  .panel h3{font-family:'Outfit',sans-serif; font-size:16px; font-weight:600; color:var(--ink); margin-bottom:18px; display:flex; justify-content:space-between; align-items:center;}
  .panel h3 span.tag{font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; background:var(--mint); color:var(--teal); text-transform:uppercase; letter-spacing:0.4px;}

  /* chart */
  .chart-wrap{position:relative; height:200px;}
  .bars{display:flex; align-items:flex-end; height:100%; gap:14px; padding-top:10px;}
  .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
  .bar{width:100%; max-width:34px; border-radius:8px 8px 3px 3px; background:linear-gradient(180deg, var(--teal-light), var(--teal)); transition:height .6s ease; box-shadow:0 6px 14px -6px rgba(14,128,116,0.5);}
  .bar-col .lbl{font-size:11px; color:var(--slate-light); margin-top:8px;}

  .dept-row{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border);}
  .dept-row:last-child{border-bottom:none;}
  .dept-row .name{flex:1; font-size:13.5px; font-weight:500; color:var(--ink);}
  .dept-bar-bg{width:90px; height:6px; background:var(--mint); border-radius:6px; overflow:hidden;}
  .dept-bar-fill{height:100%; background:var(--teal-light); border-radius:6px;}
  .dept-row .count{font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--slate-light); width:20px; text-align:right;}

  .status-pills{display:flex; flex-wrap:wrap; gap:10px;}
  .pill{padding:8px 14px; border-radius:12px; background:var(--mint); font-size:12.5px; font-weight:600; color:var(--ink); display:flex; align-items:center; gap:7px;}
  .dot{width:7px; height:7px; border-radius:50%;}

  .loading-row{padding:40px; text-align:center; color:var(--slate-light); font-size:13.5px;}
  .vitals-loader{width:120px; height:24px; margin:0 auto 10px;}
  .vitals-loader svg{width:100%; height:100%;}
  .vitals-loader path{stroke:var(--teal); stroke-width:2; fill:none; stroke-dasharray:200; stroke-dashoffset:200; animation:draw2 1.4s ease-in-out infinite;}
  @keyframes draw2{0%{stroke-dashoffset:200;} 50%{stroke-dashoffset:0;} 100%{stroke-dashoffset:-200;}}

  @media (max-width: 1100px){ .stat-grid{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;} }
  @media (max-width: 760px){ .sidebar{display:none;} .main{margin-left:0;} }
</style>
</head>
<body>

<div class="sidebar">
  <div class="brand">
    <div class="brand-mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6V12C4 17 7.5 21 12 22C16.5 21 20 17 20 12V6L12 2Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 8V16M8 12H16" stroke="white" stroke-width="1.6" stroke-linecap="round"/></svg></div>
    MediCore HMS
  </div>

  <div class="nav-section">Overview</div>
  <div class="nav-item active"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Dashboard</div>

  <div class="nav-section">Care Management</div>
  <a href="patients.html"><div class="nav-item"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>Patients</div></a>
  <a href="doctors.html"><div class="nav-item"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 3v4a2 2 0 002 2h2a2 2 0 002-2V3"/><path d="M8 21v-4a4 4 0 018 0v4"/><circle cx="12" cy="13" r="3"/></svg>Doctors</div></a>
  <a href="appointments.html"><div class="nav-item"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>Appointments</div></a>

  <div class="nav-section">Administration</div>
  <div class="nav-item"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 21V8l8-5 8 5v13"/><path d="M9 21v-6h6v6"/></svg>Departments</div>
  <div class="nav-item"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>Audit Logs</div>
  <div class="nav-item"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.6 1.6 0 00-1-1.5 1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H3a2 2 0 110-4h.1a1.6 1.6 0 001.5-1 1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V3a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg>Settings</div>

  <div class="sidebar-footer">
    <div class="avatar-sm" id="avatarInitials">--</div>
    <div>
      <div class="name" id="sidebarName">Loading…</div>
      <div class="role" id="sidebarRole">—</div>
    </div>
    <div class="logout-btn" id="logoutBtn" title="Sign out">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    </div>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <div>
      <h1>Good day, <span id="greetName">Administrator</span></h1>
      <div class="date" id="todayDate"></div>
    </div>
    <div class="top-actions">
      <div class="icon-btn"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#45525B" stroke-width="1.7"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg></div>
    </div>
  </div>

  <div id="loadingState" class="loading-row">
    <div class="vitals-loader"><svg viewBox="0 0 120 24" preserveAspectRatio="none"><path d="M0,12 L36,12 L44,3 L52,21 L60,12 L120,12"/></svg></div>
    Loading dashboard…
  </div>

  <div id="dashboardContent" style="display:none;">
    <div class="stat-grid" id="statGrid"></div>

    <div class="grid-2">
      <div class="panel">
        <h3>Appointments — last 7 days <span class="tag">Trend</span></h3>
        <div class="chart-wrap"><div class="bars" id="trendBars"></div></div>
      </div>
      <div class="panel">
        <h3>Doctors by department</h3>
        <div id="deptList"></div>
      </div>
    </div>

    <div class="panel">
      <h3>Appointment status breakdown</h3>
      <div class="status-pills" id="statusPills"></div>
    </div>
  </div>
</div>

<script>
const API_BASE = '/api';
const token = localStorage.getItem('hms_access_token');
const userRaw = localStorage.getItem('hms_user');

if (!token || !userRaw) {
  window.location.href = 'login.html';
}
const user = JSON.parse(userRaw || '{}');

document.getElementById('greetName').textContent = user.first_name || 'Administrator';
document.getElementById('sidebarName').textContent = user.full_name || '—';
document.getElementById('sidebarRole').textContent = user.role || '—';
document.getElementById('avatarInitials').textContent = ((user.first_name||' ')[0] + (user.last_name||' ')[0]).toUpperCase();
document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

document.getElementById('logoutBtn').addEventListener('click', async () => {
  try {
    await fetch(`${API_BASE}/auth/logout`, { method:'POST', headers:{ 'Authorization':`Bearer ${token}` } });
  } catch(e) {}
  localStorage.clear();
  window.location.href = 'login.html';
});

async function apiGet(path) {
  const res = await fetch(`${API_BASE}${path}`, { headers:{ 'Authorization':`Bearer ${token}` } });
  if (res.status === 401) { localStorage.clear(); window.location.href='login.html'; return; }
  return res.json();
}

const STAT_META = [
  { key:'patients', label:'Total Patients', accent:'#0E8074', icon:`<path d="M12 8a4 4 0 100-8 4 4 0 000 8zM4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" stroke="white" stroke-width="1.8" fill="none"/>` },
  { key:'doctors', label:'Active Doctors', accent:'#14A79A', icon:`<path d="M9 3v4a2 2 0 002 2h2a2 2 0 002-2V3M8 21v-4a4 4 0 018 0v4" stroke="white" stroke-width="1.8" fill="none"/>` },
  { key:'staff', label:'Total Staff', accent:'#F2A93B', icon:`<circle cx="9" cy="8" r="3" stroke="white" stroke-width="1.8" fill="none"/><circle cx="17" cy="10" r="2.4" stroke="white" stroke-width="1.8" fill="none"/><path d="M2 20c0-3.3 3.1-6 7-6s7 2.7 7 6" stroke="white" stroke-width="1.8" fill="none"/>` },
  { key:'today_appointments', label:"Today's Appointments", accent:'#E76F51', icon:`<rect x="3" y="4" width="18" height="17" rx="2" stroke="white" stroke-width="1.8" fill="none"/><path d="M8 2v4M16 2v4M3 10h18" stroke="white" stroke-width="1.8"/>` },
];

const STATUS_COLORS = { scheduled:'#8496A0', confirmed:'#14A79A', checked_in:'#F2A93B', in_progress:'#0E8074', completed:'#0B1F2E', cancelled:'#E76F51', no_show:'#B9482E' };

async function loadDashboard() {
  const data = await apiGet('/admin/dashboard');
  if (!data) return;

  const statGrid = document.getElementById('statGrid');
  statGrid.innerHTML = STAT_META.map(m => `
    <div class="stat-card" style="--accent:${m.accent}">
      <div class="icon" style="background:${m.accent}; box-shadow:0 6px 14px -4px ${m.accent}">
        <svg width="18" height="18" viewBox="0 0 24 24">${m.icon}</svg>
      </div>
      <div class="val">${data.totals[m.key] ?? 0}</div>
      <div class="lbl">${m.label}</div>
    </div>
  `).join('');

  const trend = data.appointments_last_7_days || [];
  const max = Math.max(1, ...trend.map(t => t.count));
  document.getElementById('trendBars').innerHTML = trend.map(t => {
    const heightPct = Math.max(6, (t.count / max) * 100);
    const label = new Date(t.date).toLocaleDateString('en-US', { weekday:'short' });
    return `<div class="bar-col"><div class="bar" style="height:${heightPct}%"></div><div class="lbl">${label}</div></div>`;
  }).join('');

  const depts = data.department_doctor_counts || [];
  const maxDept = Math.max(1, ...depts.map(d => d.doctors));
  document.getElementById('deptList').innerHTML = depts.length ? depts.map(d => `
    <div class="dept-row">
      <div class="name">${d.department}</div>
      <div class="dept-bar-bg"><div class="dept-bar-fill" style="width:${(d.doctors/maxDept)*100}%"></div></div>
      <div class="count">${d.doctors}</div>
    </div>
  `).join('') : '<div style="font-size:13px;color:#8496A0;">No department data yet.</div>';

  const statuses = data.appointment_status_breakdown || {};
  const entries = Object.entries(statuses);
  document.getElementById('statusPills').innerHTML = entries.length ? entries.map(([status, count]) => `
    <div class="pill"><span class="dot" style="background:${STATUS_COLORS[status] || '#8496A0'}"></span>${status.replace('_',' ')} — ${count}</div>
  `).join('') : '<div style="font-size:13px;color:#8496A0;">No appointments recorded yet.</div>';

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('dashboardContent').style.display = 'block';
}

loadDashboard();
</script>
</body>
</html>
