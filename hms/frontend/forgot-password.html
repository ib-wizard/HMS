<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password · MediCore HMS</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0B1F2E; --teal:#0E8074; --teal-light:#14A79A; --mint:#F3F8F7; --card:#FFFFFF; --border:#E7EEEC; --slate:#45525B; --slate-light:#8496A0; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif; background:var(--mint); min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--slate);}
  .card{width:100%; max-width:400px; background:var(--card); border-radius:20px; padding:40px; border:1px solid var(--border); box-shadow:0 20px 60px -24px rgba(11,31,46,0.2);}
  h2{font-family:'Outfit',sans-serif; font-size:24px; color:var(--ink); margin-bottom:8px;}
  .sub{font-size:13.5px; color:var(--slate-light); margin-bottom:26px; line-height:1.5;}
  label{display:block; font-size:13px; font-weight:600; color:var(--ink); margin-bottom:7px;}
  input{width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:10px; font-size:14.5px; background:#fbfdfd;}
  input:focus{outline:none; border-color:var(--teal); box-shadow:0 0 0 4px rgba(14,128,116,0.12);}
  button{width:100%; margin-top:20px; padding:13px; border:none; border-radius:10px; background:linear-gradient(135deg,var(--teal-light),var(--teal)); color:#fff; font-weight:600; font-size:15px; cursor:pointer;}
  .msg{margin-top:16px; padding:11px 14px; border-radius:10px; font-size:13.5px; display:none;}
  .msg.show{display:block;}
  .msg.ok{background:rgba(14,128,116,0.1); color:#0E8074;}
  .back{display:block; text-align:center; margin-top:22px; font-size:13px; color:var(--teal); text-decoration:none; font-weight:600;}
</style>
</head>
<body>
  <div class="card">
    <h2>Forgot your password?</h2>
    <div class="sub">Enter your email and, if an account exists, we'll send a secure reset link.</div>
    <form id="forgotForm">
      <label for="email">Email address</label>
      <input type="email" id="email" required placeholder="you@hospital.com">
      <button type="submit">Send reset link</button>
    </form>
    <div class="msg ok" id="msgBox"></div>
    <a class="back" href="login.html">← Back to sign in</a>
  </div>

<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const msgBox = document.getElementById('msgBox');
  try {
    const res = await fetch('/api/auth/forgot-password', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email})
    });
    const data = await res.json();
    msgBox.textContent = data.message;
    msgBox.classList.add('show');
  } catch (err) {
    msgBox.textContent = 'Something went wrong. Please try again.';
    msgBox.classList.add('show');
  }
});
</script>
</body>
</html>
