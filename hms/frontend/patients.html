<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patients · MediCore HMS</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B1F2E; --ink-2:#122E42; --teal:#0E8074; --teal-light:#14A79A;
    --mint:#F3F8F7; --card:#FFFFFF; --coral:#E76F51; --amber:#F2A93B;
    --slate:#45525B; --slate-light:#8496A0; --border:#E7EEEC; --sidebar-w:250px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif; background:var(--mint); color:var(--slate);}
  a{text-decoration:none; color:inherit;}
  .sidebar{position:fixed; top:0; left:0; width:var(--sidebar-w); height:100vh; background:linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%); color:#fff; display:flex; flex-direction:column; padding:26px 18px; z-index:50;}
  .brand{display:flex; align-items:center; gap:10px; font-family:'Outfit',sans-serif; font-weight:700; font-size:18px; padding:0 8px 26px;}
  .brand-mark{width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg, var(--teal-light), var(--teal)); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .nav-section{font-size:11px; text-transform:uppercase; letter-spacing:0.8px; color:rgba(255,255,255,0.35); padding:16px 12px 8px;}
  .nav-item{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px; font-size:14px; font-weight:500; color:rgba(255,255,255,0.75); cursor:pointer; margin-bottom:2px; transition:background .15s, color .15s;}
  .nav-item:hover{background:rgba(255,255,255,0.06); color:#fff;}
  .nav-item.active{background:rgba(20,167,154,0.18); color:#fff; box-shadow:inset 3px 0 0 var(--teal-light);}
  .sidebar-footer{margin-top:auto; padding:14px 12px; border-top:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; gap:10px;}
  .avatar-sm{width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,var(--teal-light),var(--teal)); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; color:#fff;}
  .sidebar-footer .name{font-size:13px; font-weight:600; color:#fff;}
  .sidebar-footer .role{font-size:11.5px; color:rgba(255,255,255,0.5); text-transform:capitalize;}
  .logout-btn{margin-left:auto; cursor:pointer; opacity:0.6;}
  .logout-btn:hover{opacity:1;}

  .main{margin-left:var(--sidebar-w); padding:28px 36px 60px;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; gap:20px; flex-wrap:wrap;}
  .topbar h1{font-family:'Outfit',sans-serif; font-size:25px; font-weight:700; color:var(--ink);}
  .search-box{display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid var(--border); border-radius:10px; padding:9px 14px; min-width:280px;}
  .search-box input{border:none; outline:none; font-size:13.5px; width:100%; font-family:'Inter',sans-serif;}
  .btn-primary{padding:11px 20px; border:none; border-radius:10px; background:linear-gradient(135deg,var(--teal-light),var(--teal)); color:#fff; font-weight:600; font-size:13.5px; cursor:pointer; display:flex; align-items:center; gap:7px; box-shadow:0 8px 18px -8px rgba(14,128,116,0.5);}

  .panel{background:var(--card); border-radius:16px; border:1px solid var(--border); box-shadow:0 1px 2px rgba(11,31,46,0.03); overflow:hidden;}
  table{width:100%; border-collapse:collapse;}
  thead th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:0.4px; color:var(--slate-light); padding:14px 20px; border-bottom:1px solid var(--border); background:#fafcfc;}
  tbody td{padding:15px 20px; font-size:13.5px; border-bottom:1px solid var(--border); color:var(--ink);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fafcfc; cursor:pointer;}
  .patient-code{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--slate-light);}
  .badge{padding:4px 10px; border-radius:20px; font-size:11.5px; font-weight:600;}
  .badge.male{background:rgba(14,128,116,0.1); color:#0E8074;}
  .badge.female{background:rgba(231,111,81,0.1); color:#B9482E;}
  .badge.other{background:rgba(242,169,59,0.15); color:#96650E;}

  .empty-state{padding:60px 20px; text-align:center; color:var(--slate-light);}
  .empty-state svg{margin-bottom:14px; opacity:0.5;}
  .empty-state h4{font-family:'Outfit',sans-serif; color:var(--ink); font-size:16px; margin-bottom:6px;}

  /* Modal */
  .modal-overlay{position:fixed; inset:0; background:rgba(11,31,46,0.5); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal{background:#fff; border-radius:18px; width:100%; max-width:560px; max-height:88vh; overflow-y:auto; padding:30px 32px;}
  .modal h3{font-family:'Outfit',sans-serif; font-size:20px; color:var(--ink); margin-bottom:22px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .form-grid .full{grid-column:1 / -1;}
  .modal label{display:block; font-size:12.5px; font-weight:600; color:var(--ink); margin-bottom:6px;}
  .modal input, .modal select, .modal textarea{width:100%; padding:10px 12px; border:1.5px solid var(--border); border-radius:9px; font-size:13.5px; font-family:'Inter',sans-serif; background:#fbfdfd;}
  .modal input:focus, .modal select:focus, .modal textarea:focus{outline:none; border-color:var(--teal); box-shadow:0 0 0 4px rgba(14,128,116,0.1);}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:24px;}
  .btn-ghost{padding:11px 18px; border-radius:10px; border:1.5px solid var(--border); background:#fff; font-weight:600; font-size:13.5px; cursor:pointer; color:var(--slate);}
  .alert-inline{padding:10px 14px; border-radius:9px; font-size:12.5px; margin-bottom:14px; display:none; background:rgba(231,111,81,0.1); color:#B9482E;}
  .alert-inline.show{display:block;}

  .loading-row{padding:60px; text-align:center; color:var(--slate-light); font-size:13.5px;}
  @media (max-width: 760px){ .sidebar{display:none;} .main{margin-left:0;} }
</style>
</head>
<body>

<div class="sidebar">
  <div class="brand"><div class="brand-mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6V12C4 17 7.5 21 12 22C16.5 21 20 17 20 12V6L12 2Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 8V16M8 12H16" stroke="white" stroke-width="1.6" stroke-linecap="round"/></svg></div>MediCore HMS</div>
  <div class="nav-section">Overview</div>
  <a href="admin-dashboard.html"><div class="nav-item"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Dashboard</div></a>
  <div class="nav-section">Care Management</div>
  <div class="nav-item active"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>Patients</div>
  <a href="doctors.html"><div class="nav-item"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 3v4a2 2 0 002 2h2a2 2 0 002-2V3"/><path d="M8 21v-4a4 4 0 018 0v4"/><circle cx="12" cy="13" r="3"/></svg>Doctors</div></a>
  <a href="appointments.html"><div class="nav-item"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>Appointments</div></a>
  <div class="sidebar-footer">
    <div class="avatar-sm" id="avatarInitials">--</div>
    <div><div class="name" id="sidebarName">—</div><div class="role" id="sidebarRole">—</div></div>
    <div class="logout-btn" id="logoutBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></div>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <h1>Patients</h1>
    <div style="display:flex; gap:12px; align-items:center;">
      <div class="search-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8496A0" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input type="text" id="searchInput" placeholder="Search by name, code, or phone…">
      </div>
      <button class="btn-primary" id="newPatientBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
        New Patient
      </button>
    </div>
  </div>

  <div class="panel">
    <table>
      <thead>
        <tr><th>Patient</th><th>Code</th><th>Age / Gender</th><th>Phone</th><th>Blood Group</th><th>Registered</th></tr>
      </thead>
      <tbody id="patientsTableBody">
        <tr><td colspan="6"><div class="loading-row">Loading patients…</div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>Register new patient</h3>
    <div class="alert-inline" id="formAlert"></div>
    <form id="patientForm">
      <div class="form-grid">
        <div><label>First name *</label><input type="text" id="first_name" required></div>
        <div><label>Last name *</label><input type="text" id="last_name" required></div>
        <div><label>Date of birth *</label><input type="date" id="date_of_birth" required></div>
        <div><label>Gender *</label>
          <select id="gender" required><option value="">Select…</option><option>Male</option><option>Female</option><option>Other</option></select>
        </div>
        <div><label>Blood group</label>
          <select id="blood_group"><option value="">Select…</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>O+</option><option>O-</option><option>AB+</option><option>AB-</option></select>
        </div>
        <div><label>Phone</label><input type="tel" id="phone"></div>
        <div class="full"><label>Email</label><input type="email" id="email"></div>
        <div class="full"><label>Address</label><input type="text" id="address"></div>
        <div><label>Emergency contact name</label><input type="text" id="emergency_contact_name"></div>
        <div><label>Emergency contact phone</label><input type="tel" id="emergency_contact_phone"></div>
        <div class="full"><label>Known allergies</label><textarea id="allergies" rows="2"></textarea></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="cancelModalBtn">Cancel</button>
        <button type="submit" class="btn-primary">Register patient</button>
      </div>
    </form>
  </div>
</div>

<script>
const API_BASE = '/api';
const token = localStorage.getItem('hms_access_token');
const userRaw = localStorage.getItem('hms_user');
if (!token || !userRaw) window.location.href = 'login.html';
const user = JSON.parse(userRaw || '{}');

document.getElementById('sidebarName').textContent = user.full_name || '—';
document.getElementById('sidebarRole').textContent = user.role || '—';
document.getElementById('avatarInitials').textContent = ((user.first_name||' ')[0] + (user.last_name||' ')[0]).toUpperCase();

document.getElementById('logoutBtn').addEventListener('click', async () => {
  try { await fetch(`${API_BASE}/auth/logout`, { method:'POST', headers:{ 'Authorization':`Bearer ${token}` } }); } catch(e){}
  localStorage.clear();
  window.location.href = 'login.html';
});

async function apiFetch(path, options = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    ...options,
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...(options.headers||{}) }
  });
  if (res.status === 401) { localStorage.clear(); window.location.href = 'login.html'; return; }
  return res;
}

function badgeClass(gender) {
  if (gender === 'Male') return 'male';
  if (gender === 'Female') return 'female';
  return 'other';
}

let searchTimer = null;
async function loadPatients(q = '') {
  const res = await apiFetch(`/patients?q=${encodeURIComponent(q)}&per_page=50`);
  if (!res) return;
  const data = await res.json();
  const tbody = document.getElementById('patientsTableBody');

  if (!data.patients.length) {
    tbody.innerHTML = `<tr><td colspan="6">
      <div class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#8496A0" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <h4>No patients found</h4>
        <div>Try a different search, or register a new patient.</div>
      </div>
    </td></tr>`;
    return;
  }

  tbody.innerHTML = data.patients.map(p => `
    <tr>
      <td><strong>${p.full_name}</strong></td>
      <td><span class="patient-code">${p.patient_code}</span></td>
      <td>${p.age} yrs · <span class="badge ${badgeClass(p.gender)}">${p.gender}</span></td>
      <td>${p.phone || '—'}</td>
      <td>${p.blood_group || '—'}</td>
      <td>${new Date(p.created_at).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' })}</td>
    </tr>
  `).join('');
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadPatients(e.target.value.trim()), 300);
});

const overlay = document.getElementById('modalOverlay');
document.getElementById('newPatientBtn').addEventListener('click', () => overlay.classList.add('show'));
document.getElementById('cancelModalBtn').addEventListener('click', () => overlay.classList.remove('show'));
overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('show'); });

document.getElementById('patientForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById('formAlert');
  alertBox.classList.remove('show');

  const payload = {
    first_name: document.getElementById('first_name').value.trim(),
    last_name: document.getElementById('last_name').value.trim(),
    date_of_birth: document.getElementById('date_of_birth').value,
    gender: document.getElementById('gender').value,
    blood_group: document.getElementById('blood_group').value || null,
    phone: document.getElementById('phone').value || null,
    email: document.getElementById('email').value || null,
    address: document.getElementById('address').value || null,
    emergency_contact_name: document.getElementById('emergency_contact_name').value || null,
    emergency_contact_phone: document.getElementById('emergency_contact_phone').value || null,
    allergies: document.getElementById('allergies').value || null,
  };

  const res = await apiFetch('/patients', { method:'POST', body: JSON.stringify(payload) });
  const data = await res.json();

  if (!res.ok) {
    alertBox.textContent = data.message || 'Unable to register patient';
    alertBox.classList.add('show');
    return;
  }

  overlay.classList.remove('show');
  document.getElementById('patientForm').reset();
  loadPatients();
});

loadPatients();
</script>
</body>
</html>
